name = "cutoff-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "6f016e176bf8507b75cecde460c5689d"
workers_dev = true

# Production isolate. `pnpm dev` overrides this so local wrangler can use memory.
[vars]
CUTOFF_ENV = "production"

# Unit 20: reorder nudge cron (every 15 minutes).
[triggers]
crons = ["*/15 * * * *"]

# Unit 21: nudge delivery queue + DLQ (max_retries=5).
[[queues.producers]]
binding = "NUDGE_QUEUE"
queue = "cutoff-nudges"

[[queues.consumers]]
queue = "cutoff-nudges"
max_retries = 5
dead_letter_queue = "cutoff-nudges-dlq"

# Custom domain. Deploy creates DNS and the certificate on the zone.
[[routes]]
pattern = "api.callcutoff.com"
custom_domain = true
