<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:480px;margin:0 auto;padding:40px 24px;">
      <p style="margin:0;font-size:22px;letter-spacing:-0.04em;font-weight:700;">CUTOFF</p>
      <h1 style="margin:28px 0 12px;font-size:28px;line-height:1.2;font-weight:650;">Reset your password</h1>
      <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#6e6e73;">
        A password reset was requested for {{ .Email }}. The link opens a page where you choose a new one.
      </p>
      <p style="margin:0 0 28px;">
        <a href="{{ .SiteURL }}/home/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/home/reset-password" style="color:#1b3a4b;font-size:16px;">Choose a new password</a>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#6e6e73;">
        If you didn't ask for this, you can ignore this message. The link expires on its own.
      </p>
    </div>
  </body>
</html>
