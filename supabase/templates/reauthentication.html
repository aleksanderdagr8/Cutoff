<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:480px;margin:0 auto;padding:40px 24px;">
      <p style="margin:0;font-size:22px;letter-spacing:-0.04em;font-weight:700;">CUTOFF</p>
      <h1 style="margin:28px 0 12px;font-size:28px;line-height:1.2;font-weight:650;">Your sign-in code</h1>
      <p style="margin:0 0 8px;font-size:16px;line-height:1.5;color:#6e6e73;">
        Enter this code to finish signing in. It expires in 10 minutes.
      </p>
      <p style="margin:20px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;letter-spacing:0.28em;color:#1b3a4b;">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#6e6e73;">
        If you didn't try to sign in, you can ignore this message.
      </p>
    </div>
  </body>
</html>
