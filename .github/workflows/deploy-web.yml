name: deploy-web
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy cutoff-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare token
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (see apps/web/DEPLOY.md)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build + deploy OpenNext Worker
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f016e176bf8507b75cecde460c5689d' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Public GA property — build-time inline for the client bundle.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-3K4P4MPMPD
          CUTOFF_HOME_DEV_BYPASS: "0"
          CUTOFF_OPS_DEV_BYPASS: "1"
        run: pnpm --filter @cutoff/web run deploy
