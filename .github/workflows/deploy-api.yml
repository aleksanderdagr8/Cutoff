name: deploy-api
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy cutoff-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare token
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (see apps/api/DEPLOY.md)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - name: Ensure nudge queues exist
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f016e176bf8507b75cecde460c5689d' }}
        run: |
          pnpm --filter @cutoff/api exec wrangler queues create cutoff-nudges || true
          pnpm --filter @cutoff/api exec wrangler queues create cutoff-nudges-dlq || true
      - name: Sync Supabase secrets onto cutoff-api
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f016e176bf8507b75cecde460c5689d' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE}" ]; then
            echo "::error::Missing GitHub secrets SUPABASE_URL and/or SUPABASE_SERVICE_ROLE. cutoff-api will not deploy without them — production must not run in-memory. Set both repository secrets, then re-run deploy-api."
            exit 1
          fi
          printf '%s' "$SUPABASE_URL" | pnpm --filter @cutoff/api exec wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_SERVICE_ROLE" | pnpm --filter @cutoff/api exec wrangler secret put SUPABASE_SERVICE_ROLE
      - name: Deploy cutoff-api Worker
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f016e176bf8507b75cecde460c5689d' }}
        run: pnpm --filter @cutoff/api run deploy
      - name: Redeploy cutoff-mcp (service binding needs API)
        if: steps.gate.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f016e176bf8507b75cecde460c5689d' }}
        run: pnpm --filter @cutoff/mcp run deploy
        continue-on-error: true
